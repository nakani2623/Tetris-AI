name: Bug report
description: Report a problem with the game or its tooling.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Before submitting, check whether this bug has already been reported.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the actions or inputs needed to reproduce the problem.
      placeholder: |
        1. Start the game
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and Java version, if known.
      placeholder: "e.g. macOS 15, JDK 17"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant error output or attach screenshots, if available.
